name: Gemini Editor Runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (auto = 6h daemon scheduler, manual = targeted run)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - manual
      platform:
        description: 'Target platform to scrape'
        required: false
        default: 'all_available'
        type: choice
        options:
          - all_available
          - instagram
          - youtube
          - tiktok
      target_accounts:
        description: 'Target creator handle(s) (comma-separated, e.g. username)'
        required: false
        default: ''
        type: string
      target_url:
        description: 'Source video URL to process (YouTube, TikTok, Instagram, direct link)'
        required: false
        default: ''
        type: string

  push:
    branches:
      - main

  schedule:
    # 4 clean 6-hour windows (Indian Standard Time — IST):
    - cron: '50 22 * * *'  # 04:20 AM IST
    - cron: '50 4 * * *'   # 10:20 AM IST
    - cron: '50 10 * * *'  # 04:20 PM IST
    - cron: '50 16 * * *'  # 10:20 PM IST

# ── Concurrency Control ──────────────────────────────────────────────────────
# All runs share a single concurrency group.
# cancel-in-progress: true — Ensures old hanging runs are automatically terminated
# when a new scheduled 6-hour window arrives so scheduled runs start promptly.
concurrency:
  group: rawgrab-bot
  cancel-in-progress: true

jobs:
  run-rawgrab:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Kolkata"
      GITHUB_CRON: ${{ github.event.schedule }}
      # FIX: Was 'both' (invalid choice) — corrected to 'auto'
      DISPATCH_MODE: ${{ github.event.inputs.mode || 'auto' }}
    timeout-minutes: 360   # 6-hour daemon ceiling — runs continuously for full 6-hour window until next schedule replaces it
    permissions:
      contents: write
      actions: write

    steps:

    # ── 1. Checkout ───────────────────────────────────────────────────────────
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # FIX: Prefer GH_PAT so the runner can push back to the repo
        token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

    # ── 2. Python ─────────────────────────────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    # ── 3. Set up High-Performance FFmpeg (with full drawtext & libharfbuzz) ──
    - name: Set up FFmpeg with drawtext
      run: |
        echo "🚀 Installing BtbN FFmpeg static build with full drawtext & libharfbuzz..."
        curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
        sudo mv /tmp/ffmpeg-*-linux64-gpl/bin/ffmpeg /usr/local/bin/
        sudo mv /tmp/ffmpeg-*-linux64-gpl/bin/ffprobe /usr/local/bin/
        rm -rf /tmp/ffmpeg-*-linux64-gpl
        echo "✅ FFmpeg ready: $(ffmpeg -version | head -n 1)"
        ffmpeg -filters | grep -w drawtext || (echo "❌ drawtext missing" && exit 1)

    # ── 4. Cache AI Models (HuggingFace / Faster-Whisper) ─────────────────────
    - name: Cache AI Models & Weights
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/whisper
        key: ai-models-v1-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ai-models-v1-

    # ── 5. Python Dependencies ────────────────────────────────────────────────
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary -r requirements.txt

    # ── 5. Credential Injection ───────────────────────────────────────────────
    - name: Setup Environment Variables & Tokens
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV || secrets.ENV_FILE_CONTENT }}
        GH_PAT: ${{ secrets.GH_PAT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID || vars.TELEGRAM_ADMIN_ID }}
        TELEGRAM_PUBLIC_GROUP_ID: ${{ secrets.TELEGRAM_PUBLIC_GROUP_ID || vars.TELEGRAM_PUBLIC_GROUP_ID }}
        TELEGRAM_STORAGE_GROUP_ID: ${{ secrets.TELEGRAM_STORAGE_GROUP_ID || vars.TELEGRAM_STORAGE_GROUP_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
        META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN || secrets.META_TOKEN }}
        IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        IG_BUSINESS_TOKEN: ${{ secrets.IG_BUSINESS_TOKEN || secrets.META_PAGE_TOKEN || secrets.META_TOKEN }}
        TELEGRAM_CONFIG_JSON: ${{ secrets.TELEGRAM_CONFIG_JSON }}
        CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON || secrets.YOUTUBE_CLIENT_SECRET }}
        TOKEN_JSON: ${{ secrets.TOKEN_JSON || secrets.YOUTUBE_TOKEN_JSON }}
        BRAND_WATERMARK_TEXT: ${{ secrets.BRAND_WATERMARK_TEXT || secrets.BRAND_WATERMARK }}
        AUTO_INPUT_SCHEDULE_TIMES: ${{ secrets.AUTO_INPUT_SCHEDULE_TIMES }}
        USER_7822881619_APIFY_API_TOKEN: ${{ secrets.USER_7822881619_APIFY_API_TOKEN }}
        USER_7822881619_AUTO_INPUT_SCHEDULE_TIMES: ${{ secrets.USER_7822881619_AUTO_INPUT_SCHEDULE_TIMES }}
        USER_7822881619_BRAND_WATERMARK_TEXT: ${{ secrets.USER_7822881619_BRAND_WATERMARK_TEXT }}
        USER_7822881619_CLIENT_SECRET_JSON: ${{ secrets.USER_7822881619_CLIENT_SECRET_JSON }}
        USER_7822881619_GEMINI_API_KEY: ${{ secrets.USER_7822881619_GEMINI_API_KEY }}
        USER_7822881619_IG_BUSINESS_ID: ${{ secrets.USER_7822881619_IG_BUSINESS_ID }}
        USER_7822881619_IG_BUSINESS_TOKEN: ${{ secrets.USER_7822881619_IG_BUSINESS_TOKEN }}
        USER_7822881619_META_PAGE_ID: ${{ secrets.USER_7822881619_META_PAGE_ID }}
        USER_7822881619_META_PAGE_TOKEN: ${{ secrets.USER_7822881619_META_PAGE_TOKEN }}
        USER_7822881619_TELEGRAM_PUBLIC_GROUP_ID: ${{ secrets.USER_7822881619_TELEGRAM_PUBLIC_GROUP_ID }}
        USER_7822881619_YOUTUBE_CLIENT_SECRET: ${{ secrets.USER_7822881619_YOUTUBE_CLIENT_SECRET }}
        USER_1363193987_BRAND_WATERMARK: ${{ secrets.USER_1363193987_BRAND_WATERMARK }}
        USER_1363193987_BRAND_WATERMARK_TEXT: ${{ secrets.USER_1363193987_BRAND_WATERMARK_TEXT }}
        USER_1363193987_CLIENT_SECRET_JSON: ${{ secrets.USER_1363193987_CLIENT_SECRET_JSON }}
        USER_1363193987_IG_BUSINESS_ID: ${{ secrets.USER_1363193987_IG_BUSINESS_ID }}
        USER_1363193987_IG_BUSINESS_TOKEN: ${{ secrets.USER_1363193987_IG_BUSINESS_TOKEN }}
        USER_1363193987_META_PAGE_ID: ${{ secrets.USER_1363193987_META_PAGE_ID }}
        USER_1363193987_META_PAGE_TOKEN: ${{ secrets.USER_1363193987_META_PAGE_TOKEN }}
        USER_1363193987_YOUTUBE_CLIENT_SECRET: ${{ secrets.USER_1363193987_YOUTUBE_CLIENT_SECRET }}
      run: |
        mkdir -p Credentials
        rm -f .env Credentials/.env

        # Write base .env content
        if [ -n "$ENV_FILE_CONTENT" ]; then
          echo "$ENV_FILE_CONTENT" > .env
        fi

        # Write explicit individual secrets into root .env
        [ -n "$GH_PAT" ] && echo "GH_PAT=$GH_PAT" >> .env
        [ -n "$TELEGRAM_BOT_TOKEN" ] && echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
        [ -n "$TELEGRAM_ADMIN_ID" ] && echo "TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID" >> .env
        [ -n "$TELEGRAM_CHAT_ID" ] && echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
        [ -n "$TELEGRAM_PUBLIC_GROUP_ID" ] && echo "TELEGRAM_PUBLIC_GROUP_ID=$TELEGRAM_PUBLIC_GROUP_ID" >> .env
        [ -n "$TELEGRAM_STORAGE_GROUP_ID" ] && echo "TELEGRAM_STORAGE_GROUP_ID=$TELEGRAM_STORAGE_GROUP_ID" >> .env
        [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
        [ -n "$APIFY_API_TOKEN" ] && echo "APIFY_API_TOKEN=$APIFY_API_TOKEN" >> .env
        [ -n "$META_PAGE_ID" ] && echo "META_PAGE_ID=$META_PAGE_ID" >> .env
        [ -n "$META_PAGE_TOKEN" ] && echo "META_PAGE_TOKEN=$META_PAGE_TOKEN" >> .env
        [ -n "$IG_BUSINESS_ID" ] && echo "IG_BUSINESS_ID=$IG_BUSINESS_ID" >> .env
        [ -n "$IG_BUSINESS_ID" ] && echo "IG_BUSINESS_ACCOUNT_ID=$IG_BUSINESS_ID" >> .env
        [ -n "$IG_BUSINESS_TOKEN" ] && echo "IG_BUSINESS_TOKEN=$IG_BUSINESS_TOKEN" >> .env
        [ -n "$BRAND_WATERMARK_TEXT" ] && echo "BRAND_WATERMARK_TEXT=$BRAND_WATERMARK_TEXT" >> .env
        [ -n "$AUTO_INPUT_SCHEDULE_TIMES" ] && echo "AUTO_INPUT_SCHEDULE_TIMES=$AUTO_INPUT_SCHEDULE_TIMES" >> .env
        # Write user-specific secrets into .env if present
        [ -n "$USER_7822881619_APIFY_API_TOKEN" ] && echo "USER_7822881619_APIFY_API_TOKEN=$USER_7822881619_APIFY_API_TOKEN" >> .env
        [ -n "$USER_7822881619_AUTO_INPUT_SCHEDULE_TIMES" ] && echo "USER_7822881619_AUTO_INPUT_SCHEDULE_TIMES=$USER_7822881619_AUTO_INPUT_SCHEDULE_TIMES" >> .env
        [ -n "$USER_7822881619_BRAND_WATERMARK_TEXT" ] && echo "USER_7822881619_BRAND_WATERMARK_TEXT=$USER_7822881619_BRAND_WATERMARK_TEXT" >> .env
        [ -n "$USER_7822881619_CLIENT_SECRET_JSON" ] && echo "USER_7822881619_CLIENT_SECRET_JSON=$USER_7822881619_CLIENT_SECRET_JSON" >> .env
        [ -n "$USER_7822881619_GEMINI_API_KEY" ] && echo "USER_7822881619_GEMINI_API_KEY=$USER_7822881619_GEMINI_API_KEY" >> .env
        [ -n "$USER_7822881619_IG_BUSINESS_ID" ] && echo "USER_7822881619_IG_BUSINESS_ID=$USER_7822881619_IG_BUSINESS_ID" >> .env
        [ -n "$USER_7822881619_IG_BUSINESS_TOKEN" ] && echo "USER_7822881619_IG_BUSINESS_TOKEN=$USER_7822881619_IG_BUSINESS_TOKEN" >> .env
        [ -n "$USER_7822881619_META_PAGE_ID" ] && echo "USER_7822881619_META_PAGE_ID=$USER_7822881619_META_PAGE_ID" >> .env
        [ -n "$USER_7822881619_META_PAGE_TOKEN" ] && echo "USER_7822881619_META_PAGE_TOKEN=$USER_7822881619_META_PAGE_TOKEN" >> .env
        [ -n "$USER_7822881619_TELEGRAM_PUBLIC_GROUP_ID" ] && echo "USER_7822881619_TELEGRAM_PUBLIC_GROUP_ID=$USER_7822881619_TELEGRAM_PUBLIC_GROUP_ID" >> .env
        [ -n "$USER_7822881619_YOUTUBE_CLIENT_SECRET" ] && echo "USER_7822881619_YOUTUBE_CLIENT_SECRET=$USER_7822881619_YOUTUBE_CLIENT_SECRET" >> .env
        [ -n "$USER_1363193987_BRAND_WATERMARK" ] && echo "USER_1363193987_BRAND_WATERMARK=$USER_1363193987_BRAND_WATERMARK" >> .env
        [ -n "$USER_1363193987_BRAND_WATERMARK_TEXT" ] && echo "USER_1363193987_BRAND_WATERMARK_TEXT=$USER_1363193987_BRAND_WATERMARK_TEXT" >> .env
        [ -n "$USER_1363193987_CLIENT_SECRET_JSON" ] && echo "USER_1363193987_CLIENT_SECRET_JSON=$USER_1363193987_CLIENT_SECRET_JSON" >> .env
        [ -n "$USER_1363193987_IG_BUSINESS_ID" ] && echo "USER_1363193987_IG_BUSINESS_ID=$USER_1363193987_IG_BUSINESS_ID" >> .env
        [ -n "$USER_1363193987_IG_BUSINESS_TOKEN" ] && echo "USER_1363193987_IG_BUSINESS_TOKEN=$USER_1363193987_IG_BUSINESS_TOKEN" >> .env
        [ -n "$USER_1363193987_META_PAGE_ID" ] && echo "USER_1363193987_META_PAGE_ID=$USER_1363193987_META_PAGE_ID" >> .env
        [ -n "$USER_1363193987_META_PAGE_TOKEN" ] && echo "USER_1363193987_META_PAGE_TOKEN=$USER_1363193987_META_PAGE_TOKEN" >> .env
        [ -n "$USER_1363193987_YOUTUBE_CLIENT_SECRET" ] && echo "USER_1363193987_YOUTUBE_CLIENT_SECRET=$USER_1363193987_YOUTUBE_CLIENT_SECRET" >> .env
        echo "CLIENT_SECRET_FILE=Credentials/youtube/client_secret.json" >> .env
        echo "YOUTUBE_TOKEN_FILE=Credentials/youtube/token.json" >> .env
        echo "AUTO_PUBLISH_CLIPS=yes" >> .env

        # Sync to Credentials/.env
        cp .env Credentials/.env

        # Telegram config
        if [ -n "$TELEGRAM_CONFIG_JSON" ]; then
          echo "$TELEGRAM_CONFIG_JSON" > Credentials/telegram_config.json
        fi

        # YouTube OAuth files
        mkdir -p Credentials/youtube
        if [ -n "$CLIENT_SECRET_JSON" ]; then
          echo "$CLIENT_SECRET_JSON" > Credentials/youtube/client_secret.json
          echo "$CLIENT_SECRET_JSON" > Credentials/client_secret.json
          echo "Injected root default YT client_secret"
        fi
        if [ -n "$TOKEN_JSON" ]; then
          echo "$TOKEN_JSON" > Credentials/youtube/token.json
          echo "$TOKEN_JSON" > Credentials/token.json
          echo "Injected root default YT token"
        fi

    # ── 6. Run RawGrab Engine ─────────────────────────────────────────────────
    - name: Run RawGrab Engine
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }}
        DISPATCH_MODE: ${{ github.event.inputs.mode || 'auto' }}
        DISPATCH_PLATFORM: ${{ github.event.inputs.platform || 'all_available' }}
        DISPATCH_TARGET_ACCOUNTS: ${{ github.event.inputs.target_accounts || '' }}
        DISPATCH_TARGET_URL: ${{ github.event.inputs.target_url || '' }}
      run: |
        # FIX: Store the spaced path in a variable so it is correctly quoted everywhere
        LOCK_FILE="Phase_1/The jsons/Github_Actions_json/bot_lock.json"
        # ── Scheduled-run fast-exit guard ────────────────────────────────────
        if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f "$LOCK_FILE" ]; then
          LOCK_EXPIRES=$(python3 -c "
        import json, sys
        try:
            data = json.load(open('Phase_1/The jsons/Github_Actions_json/bot_lock.json'))
            print(data.get('expires_at', 0))
        except Exception:
            print(0)
        " 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ "$LOCK_EXPIRES" -gt "$NOW" ]; then
            MINS_LEFT=$(( (LOCK_EXPIRES - NOW) / 60 ))
            echo "🔒 [CI GUARD] Active bot lock found (~${MINS_LEFT}m remaining). Skipping duplicate cron run."
            exit 0
          fi
        fi
        # ── Write bot_lock.json so overlapping crons self-skip ────────────────
        mkdir -p "Phase_1/The jsons/Github_Actions_json"
        python3 -c "
        import json, time, os
        lock = {'started_at': int(time.time()), 'expires_at': int(time.time()) + 9000}
        with open('Phase_1/The jsons/Github_Actions_json/bot_lock.json', 'w') as f:
            json.dump(lock, f)
        print('🔐 Bot lock written (expires in ~150 min)')
        "
        # ── Clean up bot lock on script exit ────────────────────────────────
        cleanup() {
          rm -f "Phase_1/The jsons/Github_Actions_json/bot_lock.json"
          echo "🔓 Bot lock released."
        }
        trap cleanup EXIT
        # ─────────────────────────────────────────────────────────────────────
        echo "🤖 Executing RawGrab daemon scheduler mode ($DISPATCH_MODE)..."
        python main.py

    # ── 7. Commit State Back to Repo ─────────────────────────────────────────
    - name: Commit Dedup State to Git
      if: always()
      continue-on-error: true
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        set +e
        git config user.name  "RawGrab Bot"
        git config user.email "rawgrab-bot@users.noreply.github.com"

        # FIX: Authenticate git push via GH_PAT or GITHUB_TOKEN
        if [ -n "$GH_PAT" ]; then
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
        else
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        fi

        # Wipe leftover clip files and lock file before committing state
        rm -f "Phase_1/The jsons/Github_Actions_json/bot_lock.json" 2>/dev/null || true
        find downloads/ -name "*.mp4" -type f -delete 2>/dev/null || true
        find downloads/ -empty -type d -delete 2>/dev/null || true

        # Stage state files if present
        # FIX: Use quoted path instead of backslash-escape (more reliable in run blocks)
        git add -A "Phase_1/The jsons/Github_Actions_json/" 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "No state changes to commit."
        else
          git commit -m "ci: release bot lock and update state [skip ci]"
          git fetch origin main
          git rebase origin/main --strategy-option=theirs || git rebase --abort
          git push origin HEAD:main || echo "Push skipped (concurrent run or auth failure)"
          echo "State committed."
        fi
        exit 0
